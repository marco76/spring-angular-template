server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    proxy_pass http://backend:8080/actuator/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger-ui/ {
    proxy_pass http://backend:8080/swagger-ui/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI's own page fetches its spec from /v3/api-docs client-side;
  # without this the "API Docs" link renders the Swagger UI shell but it
  # can never load anything into it. Forwarded headers matter here more
  # than for the other locations: springdoc uses them to build the
  # "servers" entry in the generated spec, which is what "Try it out"
  # sends requests to - without them it advertises the backend's internal
  # address instead of the address the browser can actually reach.
  location /v3/api-docs {
    proxy_pass http://backend:8080/v3/api-docs;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

